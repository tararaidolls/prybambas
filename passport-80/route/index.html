<title>Live route map · Prybambas Passport</title><meta name="description" content="Live route map — bonus page for the Prybambas Passport reading journal for Around the World in 80 Days (ages 6–12).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>/* VOICE: warm, curious explorer's companion for kids 6-12 and their grown-ups
   IDEA: the pages of a travel passport/journal from 1872 that came to life
   PICTURE: each page leads with its working thing — stamp, map, experiment, quiz
   COLOUR: journal navy, stamp red, paper white, yellow note card
   TYPE: Rubik bold headings (like the book), Nunito body
   LAYOUT: single calm column up to 760px, big touch targets */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaf6,#141a26);--card:light-dark(#ffffff,#1d2535);--ink:light-dark(#1d2433,#eef1f7);
--muted:light-dark(#5d6678,#a9b2c4);--navy:light-dark(#1c3d6e,#8fb3ea);--red:light-dark(#d4452b,#ff7a5c);
--note:light-dark(#fff6dc,#2b2a1f);--noteb:light-dark(#e8c25a,#b8973a);--line:light-dark(#e3ded2,#2f3a50);
--sea:light-dark(#dcebf6,#16263c);--land:light-dark(#efe4c8,#3a4256);--purple:light-dark(#7b3fb5,#c49cf0);--green:light-dark(#4f7f2f,#9fd07a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Rubik,Nunito,system-ui,sans-serif;color:var(--navy);line-height:1.1;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(32px,7vw,46px);font-weight:800}h2{font-size:24px;font-weight:700;margin-top:1.4em}h3{font-size:19px}
a{color:var(--navy)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(5vw,16px);border-bottom:2px solid var(--navy);font-size:14px}
.top b{font-family:Rubik,sans-serif;color:var(--navy);letter-spacing:.02em}
.top a{font-weight:700;text-decoration:none;padding:8px 0}
main{max-width:760px;margin:0 auto;padding:24px max(5vw,16px) 56px}
.tag{display:inline-block;font:700 13px Rubik,sans-serif;color:#fff;background:var(--navy);border-radius:99px;padding:4px 12px;margin-bottom:12px}
.tag.red{background:var(--red)}.tag.purple{background:var(--purple)}.tag.green{background:var(--green)}
.lead{font-size:19px;color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:2px solid var(--navy);border-radius:18px;padding:20px;margin:18px 0}
.note{background:var(--note);border:2px solid var(--noteb);border-radius:18px;padding:18px 20px;margin:18px 0}
.lvl{font:700 13px Rubik,sans-serif;border-radius:99px;padding:3px 10px;margin-right:6px;white-space:nowrap}
.lvl.d{background:#f2c14e;color:#3a2b00}.lvl.n{background:var(--navy);color:var(--card)}
button,.btn{font:700 17px Rubik,Nunito,sans-serif;min-height:48px;padding:10px 20px;border-radius:14px;border:2px solid var(--navy);background:var(--navy);color:var(--card);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button.ghost,.btn.ghost{background:transparent;color:var(--navy)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input[type=text]{font:700 20px Rubik,sans-serif;letter-spacing:.08em;text-transform:uppercase;min-height:52px;padding:8px 14px;border:2px solid var(--navy);border-radius:14px;background:var(--card);color:var(--ink);width:100%}
input.plain{text-transform:none;letter-spacing:0;font:600 17px Nunito,sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fig{position:relative;width:100%}.fig svg{display:block;width:100%;height:auto}
.story p{margin:0 0 1em}
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.foot{text-align:center;color:var(--muted);font-size:14px;padding:24px 16px 40px;border-top:1px solid var(--line)}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
details{border-top:1px dashed var(--line);padding:10px 0}summary{cursor:pointer;font-weight:700;color:var(--navy);min-height:32px}
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:520px){.stamps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{text-align:center;font-size:13px;color:var(--muted);text-decoration:none}
.slot svg{width:100%;height:auto}
.hl{background:var(--note);padding:0 4px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.foot,.noprint{display:none}}
</style><script>const P80={
 stamps:[
  {id:'london',city:'London',date:'Oct 2, 1872',word:'CLOCK',stage:'Stage 1 · London',icon:'clock'},
  {id:'suez',city:'Suez',date:'Oct 9, 1872',word:'CANAL',stage:'Stage 2 · Europe and Suez',icon:'pyramid'},
  {id:'india',city:'India',date:'Oct 25, 1872',word:'KIOUNI',stage:'Stage 3 · India',icon:'dome'},
  {id:'hongkong',city:'Hong Kong',date:'Nov 6, 1872',word:'TYPHOON',stage:'Stage 4 · Singapore and Hong Kong',icon:'spiral'},
  {id:'yokohama',city:'Yokohama',date:'Nov 14, 1872',word:'CRANE',stage:'Stage 5 · Japan',icon:'crane'},
  {id:'sanfrancisco',city:'San Francisco',date:'Dec 3, 1872',word:'GRANT',stage:'Stage 6 · The Pacific',icon:'ship'},
  {id:'newyork',city:'New York',date:'Dec 11, 1872',word:'SAIL',stage:'Stage 7 · Across America',icon:'sledge'},
  {id:'return',city:'London',date:'Dec 21, 1872',word:'EAST',stage:'Stage 8 · Home',icon:'compass'}],
 get(k,d){try{const v=localStorage.getItem('p80_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem('p80_'+k,JSON.stringify(v))}catch(e){}},
 have(){return this.get('stamps',[])},
 add(id){const s=this.have();if(!s.includes(id)){s.push(id);this.set('stamps',s)}},
 icon(n,c){const s=`stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"`;return({
  clock:`<circle cx="100" cy="92" r="24" ${s}/><path d="M100 76v16l11 7" ${s}/>`,
  pyramid:`<path d="M70 112l26-40 26 40z M104 112l16-24 16 24" ${s}/><circle cx="130" cy="70" r="7" ${s}/>`,
  dome:`<path d="M74 114h52M80 114v-18h40v18M84 96c0-16 8-22 16-28 8 6 16 12 16 28M100 68v-6M68 114v-24M132 114v-24" ${s}/>`,
  spiral:`<path d="M100 92c0-4 6-4 6 0 0 8-12 8-12 0 0-12 18-12 18 0 0 16-24 16-24 0 0-20 30-20 30 0" ${s}/>`,
  crane:`<path d="M66 100l34-6 34-26-20 30 22 4-30 4-8 12-6-12-26-6z M100 94l-8-22" ${s}/>`,
  ship:`<path d="M70 104h60l-8 12H78z M84 104V88h30v16 M92 88V74h10v14" ${s}/><path d="M104 70c6-4 12-4 16 0" ${s}/>`,
  sledge:`<path d="M70 112h56c6 0 8-6 4-8 M78 106h44 M100 106V68l22 34H100" ${s}/>`,
  compass:`<circle cx="100" cy="92" r="24" ${s}/><path d="M100 76l6 16-6 16-6-16z" ${s}/><path d="M124 92h10l-5-5m5 5l-5 5" ${s}/>`})[n]||''},
 stampSVG(st,on){const c=on?'var(--red)':'var(--line)',t=on?'var(--red)':'var(--muted)';const id='a'+st.id;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${st.city} stamp${on?'':' (not yet)'}">
  <circle cx="100" cy="100" r="94" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="100" cy="100" r="82" fill="${on?'light-dark(#fff,#1d2535)':'none'}" stroke="${c}" stroke-width="8"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="${c}" stroke-width="2"/>
  <path id="${id}" d="M42 100a58 58 0 0 1 116 0" fill="none"/>
  <text font-family="Rubik,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="${t}"><textPath href="#${id}" startOffset="50%" text-anchor="middle">PRYBAMBAS</textPath></text>
  ${on?this.icon(st.icon,'var(--red)'):`<text x="100" y="104" text-anchor="middle" font-size="34" font-family="Rubik" fill="${t}">?</text>`}
  <rect x="38" y="118" width="124" height="${st.city.length>9?26:30}" rx="4" fill="${on?'var(--red)':'none'}" stroke="${c}" stroke-width="2"/>
  <text x="100" y="${st.city.length>9?136:140}" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="${st.city.length>9?15:20}" fill="${on?'#fff':t}">${st.city.toUpperCase()}</text>
  <text x="100" y="164" text-anchor="middle" font-family="Nunito,sans-serif" font-size="12" font-weight="700" fill="${t}">${st.date}</text></svg>`},
 voice(){const v=speechSynthesis.getVoices();return v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))},
 // Audio player: plays ./audio.mp3 if you upload one next to the page, otherwise reads the text aloud
 listen(btn,textEl){let speaking=false;const audio=new Audio('audio.mp3');let hasFile=false;
  audio.addEventListener('canplaythrough',()=>{hasFile=true},{once:true});audio.load();
  audio.onended=()=>{btn.textContent='▶ Listen';speaking=false};
  btn.addEventListener('click',()=>{
   if(hasFile){if(audio.paused){audio.play().catch(()=>{});btn.textContent='❚❚ Pause'}else{audio.pause();btn.textContent='▶ Listen'}return}
   if(!('speechSynthesis' in window)){btn.textContent='Audio not available';return}
   if(speaking){speechSynthesis.cancel();speaking=false;btn.textContent='▶ Listen';return}
   const u=new SpeechSynthesisUtterance(textEl.innerText);const v=P80.voice();if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=.92;
   u.onend=()=>{speaking=false;btn.textContent='▶ Listen'};speechSynthesis.speak(u);speaking=true;btn.textContent='■ Stop'});}
};

const start=new Date(Date.UTC(1872,9,2));

let proj,path,ok=typeof d3!=='undefined';
function seg(d){for(let i=0;i<W.length-1;i++)if(d<=W[i+1][3])return i;return W.length-2}
function pos(d){const i=seg(d),a=W[i],b=W[i+1],t=b[3]===a[3]?1:(d-a[3])/(b[3]-a[3]);
 if(ok)return d3.geoInterpolate([a[2],a[1]],[b[2],b[1]])(Math.max(0,Math.min(1,t)));return [a[2]+(b[2]-a[2])*t,a[1]+(b[1]-a[1])*t]}
const xy=p=>ok?proj(p):[(p[0]+180)/360*960,(90-p[1])/180*500];
function line(upTo){const pts=[];for(const w of W){if(w[3]<=upTo)pts.push([w[2],w[1]])}pts.push(pos(upTo));return {type:'LineString',coordinates:pts}}
const full={type:'LineString',coordinates:W.map(w=>[w[2],w[1]])};
function rough(){const P=r=>'M'+r.map(p=>xy(p).map(v=>v.toFixed(1)).join(' ')).join('L')+'Z';return `<path d="${LAND.map(P).join('')}" fill="var(--land)" stroke="var(--line)" stroke-width=".6" stroke-linejoin="round"/><path d="${LAKES.map(P).join('')}" fill="var(--sea)"/>`}
function base(land){let h='';
 if(ok){proj=d3.geoNaturalEarth1().fitExtent([[8,8],[952,492]],{type:'Sphere'});path=d3.geoPath(proj);
  h+=`<path d="${path({type:'Sphere'})}" fill="var(--sea)"/><path d="${path(d3.geoGraticule10())}" fill="none" stroke="var(--line)" stroke-width=".6"/>`;

  h+=`<path d="${path(full)}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-dasharray="5 6" opacity=".55"/>`;}
 else h+=`<rect width="960" height="500" fill="var(--sea)"/>`+rough();

 W.forEach(w=>{if(/Ocean|Sea/.test(w[0]))return;const [x,y]=xy([w[2],w[1]]);h+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--card)" stroke="var(--navy)" stroke-width="2"/>`});
 h+=`<g id="me"><circle r="13" fill="var(--red)" opacity=".25"/><circle r="7" fill="var(--red)" stroke="#fff" stroke-width="2"/></g><text id="lbl" font-family="Rubik,sans-serif" font-weight="700" font-size="20" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="5"></text>`;
 svg.innerHTML=h;draw(+dayI.value)}
function draw(d){const p=pos(d),[x,y]=xy(p),i=seg(d);
 document.getElementById('me').setAttribute('transform',`translate(${x},${y})`);
 const near=W.find(w=>Math.abs(w[3]-d)<.6);const name=near?near[0]:`${W[i][0]} → ${W[i+1][0]}`;

 if(ok)document.getElementById('done').setAttribute('d',path(line(d))||'');

 document.getElementById('where').textContent=name;
 document.getElementById('date').textContent='Day '+Math.floor(d)+' · '+fmt(d);
 document.getElementById('how').textContent=near?near[4]:'Travelling by '+how(i)+'.'}
