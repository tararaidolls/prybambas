<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="AI Coach — practise writing in a new language with a friendly coach. Part of Prybambas, free for kids 5–14.">
<link rel="canonical" href="https://prybambas.com/coach/">
<meta property="og:title" content="AI Coach — Language Practice for Kids | Prybambas">
<meta property="og:description" content="Write sentences with verbs from your workbook and practise with a friendly coach.">
<meta property="og:url" content="https://prybambas.com/coach/">
<meta property="og:image" content="https://prybambas.com/logo.png">

    <title>AI Coach | Prybambas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Geologica:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/notebook.css">
    <meta name="theme-color" content="#FBFCFE">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="8460fd7f-da31-46c7-8c9d-eff5e64399cc"></script>
    <script src="../assets/i18n-fallback.js"></script>
</head>
<body>

    <!-- Уніфікована панель вгорі -->
    <div class="top-bar">
        <a href="../index.html" class="back-btn" id="btn-back">← Hub</a>
        <select class="lang-switch" id="lang-selector" onchange="changeLang()" aria-label="Language">
            <option value="en">🇺🇸 English</option>
            <option value="uk">🇺🇦 Українська</option>
            <option value="ro">🇷🇴 Română</option>
            <option value="pl">🇵🇱 Polski</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="sv">🇸🇪 Svenska</option>
            <option value="fi">🇫🇮 Suomi</option>
            <option value="da">🇩🇰 Dansk</option>
            <option value="es">🇪🇸 Español</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="he">🇮🇱 עברית</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ar">🇸🇦 العربية</option>
        </select>
    </div>

    <!-- Логотип серії -->
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="40" stroke="var(--cyan)" stroke-width="4" stroke-dasharray="10 6" />
            <path d="M50 30 C35 30 35 70 50 70 C65 70 65 30 50 30 Z" stroke="white" stroke-width="3" />
        </svg>
        <span class="logo-text">AI COACH</span>
    </div>

    <div class="chat-card">
        <div class="chat-header">
            <h2 id="header-title">Polyglot AI Coach</h2>
            <p id="header-desc">Practice what you write with your virtual language coach!</p>
        </div>

        <!-- КНОПКА ПЕРЕХОДУ НА CUSTOM GPT (Для перевірки по фотографії) -->
        <a href="https://chatgpt.com/g/g-your-coach-id-here" class="launch-btn" target="_blank" id="launch-gpt-btn">
            📸 Check Handwriting by Photo
        </a>

        <div class="chat-messages" id="chat-box">
            <div class="msg bot" id="welcome-msg">Hi! I am your virtual language coach. Type a sentence using one of the verbs from your workbook, and I will correct any mistakes or practice with you!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="user-input" placeholder="Type a sentence..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>

    <script>
        const dict = {
            en: {
                back: "← Hub",
                header: "Polyglot AI Coach",
                desc: "Practice what you write with your virtual language coach!",
                welcome: "Hi! I am your virtual language coach. Type a sentence using one of the verbs from your workbook, and I will correct any mistakes or practice with you!",
                placeholder: "Type a sentence...",
                bot_thinking: "Thinking...",
                launch: "📸 Check Handwriting by Photo",
                bot_reply: "Excellent sentence! Your grammar is perfect. Keep practicing! 🚀",
                submit_prefix: "I submitted an invention idea: ",
                submit_reply: "Wow, that is a brilliant engineering solution! You applied the TRIZ tools beautifully. What if you combine this with another material to make it even stronger? Let's discuss! 💡"
            },
            uk: {
                back: "← Хаб",
                header: "AI Мовний Тренер",
                desc: "Практикуй написане разом зі своїм віртуальним наставником!",
                welcome: "Привіт! Я твій мовний тренер. Напиши речення, використовуючи будь-яке дієслово з твого зошита, і я перевірю твою граматику!",
                placeholder: "Напиши речення...",
                bot_thinking: "Думаю...",
                launch: "📸 Перевірити зошит по фото",
                bot_reply: "Чудове речення! Твоя граматика ідеальна. Продовжуй практикуватися! 🚀",
                submit_prefix: "Я надіслав винахідницьку ідею: ",
                submit_reply: "Ого, це просто блискуче інженерне рішення! Ти чудово застосувала інструменти ТРВЗ. А що, якби додати до цього інший матеріал, щоб зробити конструкцію ще міцнішою? Давай обговоримо! 💡"
            }
        };

        let currentLang = 'en';

        function changeLang() {
            currentLang = document.getElementById('lang-selector').value;
            localStorage.setItem('prybambas_lang', currentLang);
            
            const t = withEnglish(dict, currentLang);
            document.getElementById('btn-back').innerText = t.back;
            document.getElementById('header-title').innerText = t.header;
            document.getElementById('header-desc').innerText = t.desc;
            document.getElementById('welcome-msg').innerText = t.welcome;
            document.getElementById('user-input').placeholder = t.placeholder;
            document.getElementById('launch-gpt-btn').innerText = t.launch;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            const chatBox = document.getElementById('chat-box');
            
            // 1. User Message
            const uMsg = document.createElement('div');
            uMsg.className = 'msg user';
            uMsg.innerText = text;
            chatBox.appendChild(uMsg);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Bot Thinking
            const tMsg = document.createElement('div');
            tMsg.className = 'msg bot';
            tMsg.innerText = withEnglish(dict, currentLang).bot_thinking;
            chatBox.appendChild(tMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Bot Actual Reply (Simulated for local offline PWA / Wizard of Oz)
            setTimeout(() => {
                tMsg.innerText = withEnglish(dict, currentLang).bot_reply;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        // Обробка ідеї, що прийшла через сабміт-місток
        function checkSubmittedIdea() {
            const idea = localStorage.getItem('prybambas_submit_idea');
            if (idea) {
                // Видаляємо з пам'яті, щоб повідомлення не дублювалося при оновленні сторінки
                localStorage.removeItem('prybambas_submit_idea');

                const chatBox = document.getElementById('chat-box');
                const t = withEnglish(dict, currentLang);

                // 1. Додаємо ідею як повідомлення від юзера
                const uMsg = document.createElement('div');
                uMsg.className = 'msg user';
                uMsg.innerText = t.submit_prefix + `"${idea}"`;
                chatBox.appendChild(uMsg);

                // 2. Додаємо бот-реплай спеціально під винахід
                setTimeout(() => {
                    const tMsg = document.createElement('div');
                    tMsg.className = 'msg bot';
                    tMsg.innerText = t.submit_reply;
                    chatBox.appendChild(tMsg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 800);
            }
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('prybambas_lang') || 'en';
            document.getElementById('lang-selector').value = savedLang;
            changeLang();
            checkSubmittedIdea(); // Перевіряємо сабміт-місток
        }
    </script>
</body>
</html>
