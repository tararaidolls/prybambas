# Гра або інструмент на сайті. Картка зʼявляється на головній автоматично.
url: /what-if/            # адреса гри на сайті
order: 1                  # порядок на головній
skills: [curiosity, critical-thinking]   # curiosity | observation | critical-thinking | languages | soft-skills | parents
ages: "5-14"
tape: "var(--yellow)"     # колір «скотчу» на картці
spot: "var(--yellow)"     # колір кружечка за іконкою
tilt: -3                   # нахил скотчу, градуси
tapeOpacity: 0.75
icon: icon.svg             # чорнильна іконка 100×100
