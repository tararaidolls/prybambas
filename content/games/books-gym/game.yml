# Гра або інструмент на сайті. Картка зʼявляється на головній автоматично.
url: /book/            # веде в магазин мовою відвідувача
order: 3                  # порядок на головній
skills: [observation]   # curiosity | observation | critical-thinking | languages | soft-skills | parents
ages: "5-14"
tape: "var(--pink)"     # колір «скотчу» на картці
spot: "var(--pink)"     # колір кружечка за іконкою
tilt: -1                   # нахил скотчу, градуси
tapeOpacity: 0.55
icon: icon.svg             # чорнильна іконка 100×100
localized: false          # веде в магазин, окремих мовних адрес не треба
