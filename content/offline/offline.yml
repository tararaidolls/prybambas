# Prybambas Offline — плакати для зон очікування (клініки, кафе, салони).
# Сторінка-конструктор: /uk/offline/ і /en/offline/ (prybambas.com/offline/ веде туди).
#
# Як це працює:
#   1) заклад збирає плакат: базовий плакат + ігри з QR + друковані завдання + свій логотип;
#   2) надсилає заявку (форма нижче) → ти отримуєш її з кодом конфігурації й логотипом;
#   3) виставляєш рахунок; після оплати — npm run offline:print -- заявка.json
#      → готовий PNG 300 dpi → замовлення в Gelato на адресу закладу.
# Докладно — OFFLINE.md.

# Скільки чого можна обрати на одному плакаті
maxGames: 3
maxTasks: 4

# Формати друку. Розміри в мм (портрет).
# gelato — productUid плаката в Gelato (кабінет Gelato → Products → постер потрібного розміру/паперу);
#   поки порожньо, заявка просто містить назву формату.
# price — ціна для закладу (рядок, як показати на сайті, напр. "€29"); порожньо → «ціна в рахунку».
sizes:
  - { key: a3,    label: "A3 · 29,7 × 42 см", w: 297, h: 420, gelato: "", price: "" }
  - { key: a2,    label: "A2 · 42 × 59,4 см", w: 420, h: 594, gelato: "", price: "" }
  - { key: 50x70, label: "50 × 70 см",        w: 500, h: 700, gelato: "", price: "" }
defaultSize: a2

# Запас під обріз у мм з кожного боку для файлу друку. Звір зі специфікацією продукту в Gelato.
bleed: 4

# Ігри, які можна поставити на плакат (папки з content/games/). Порядок = порядок у конструкторі.
games: [what-if, inventor, coach, little]

# Куди надсилається заявка. Будь-який сервіс форм, що приймає POST (Formspree, Basin, Getform…).
#   Щоб приходив і файл логотипа, сервіс має підтримувати вкладення (Formspree — платний план, Basin, Getform).
# Поки action порожній, конструктор пропонує завантажити файл заявки й надіслати його на email нижче.
request:
  action: ""
  email: "hello@prybambas.com"
