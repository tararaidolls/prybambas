# Загальні налаштування сайту
url: https://prybambas.com
name: Prybambas

# Мови магазину й дописів. Щоб додати мову:
# 1) допиши її код сюди, 2) додай переклад інтерфейсу в i18n.yml,
# 3) додавай файли <код>.md до товарів і дописів.
languages: [uk, en, pl, de, es]
defaultLang: en

# Усі мови сайту — єдиний список для перемикачів мов в іграх і на головній.
# Щоб додати мову в ігри: допиши її сюди і додай переклади у файли ігор.
gameLanguages:
  - { code: en, name: English,    flag: "🇺🇸" }
  - { code: uk, name: Українська, flag: "🇺🇦" }
  - { code: ro, name: Română,     flag: "🇷🇴" }
  - { code: pl, name: Polski,     flag: "🇵🇱" }
  - { code: de, name: Deutsch,    flag: "🇩🇪" }
  - { code: fr, name: Français,   flag: "🇫🇷" }
  - { code: it, name: Italiano,   flag: "🇮🇹" }
  - { code: sv, name: Svenska,    flag: "🇸🇪" }
  - { code: fi, name: Suomi,      flag: "🇫🇮" }
  - { code: da, name: Dansk,      flag: "🇩🇰" }
  - { code: es, name: Español,    flag: "🇪🇸" }
  - { code: pt, name: Português,  flag: "🇵🇹" }
  - { code: he, name: עברית,      flag: "🇮🇱", rtl: true }
  - { code: ja, name: 日本語,      flag: "🇯🇵" }
  - { code: ar, name: العربية,    flag: "🇸🇦", rtl: true }

# Майданчики продажу. Порядок тут = порядок кнопок на сторінці товару.
# kind: digital (файл) або print (друкована книжка)
stores:
  - { key: site,    label: Prybambas, kind: digital }
  - { key: gumroad, label: Gumroad,   kind: digital }
  - { key: etsy,    label: Etsy,      kind: digital }
  - { key: tpt,     label: TpT,       kind: digital }
  - { key: kdp,     label: Amazon,    kind: print }
  - { key: prom,    label: Prom.ua,   kind: digital, markets: [uk] }   # markets: показувати лише цими мовами сайту

# Ігри тепер описані в content/games/<назва>/ (картка на головній + посилання з товарів).
# Тут — лише додаткові адреси для поля game у product.yml, яких немає серед ігор.
games:
  first-foods: /little/first-foods/
